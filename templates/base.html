<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ExamWeb{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
{% block nav %}<nav>
  <a href="{{ url_for('index') }}"><b>ExamWeb</b></a>
  {% if current_user.is_authenticated %}
    <a href="{{ url_for('upload') }}">Upload Soal</a>
    <span class="right">{{ current_user.username }}
      <form method="post" action="{{ url_for('logout') }}" class="inline"><button>Logout</button></form>
    </span>
  {% else %}
    <span class="right"><a href="{{ url_for('login') }}">Login</a><a href="{{ url_for('register') }}">Register</a></span>
  {% endif %}
</nav>{% endblock %}
<main>
  {% for cat, msg in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ cat }}">{{ msg }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
<script>
  // tombol back/forward: selalu muat ulang dari server (jangan tampilkan halaman lama dari cache)
  window.addEventListener('pageshow', function (e) {
    var nav = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    if (e.persisted || (nav && nav.type === 'back_forward')) { window.__reloading = true; location.reload(); }
  });
</script>
</body></html>
